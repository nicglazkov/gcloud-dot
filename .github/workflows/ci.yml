name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v4

      # wry links against the system webview, so the tray binary needs these
      # headers even to compile. The engine and CLI do not, which is what keeps
      # `gcloud-dot` installable on a machine with no desktop at all.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # Every test in this project is a logic test with no window and no
      # subprocess, so the suite runs headless on all three platforms.
      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --release --workspace

  # Proves the claim the README makes: the CLI builds with no desktop libraries
  # present. If this ever fails, a GUI dependency has leaked into the core.
  headless:
    name: CLI builds without a desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p gcloud-dot-cli
