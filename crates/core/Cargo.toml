[package]
name = "gcloud-dot-core"
description = "Session tracking engine for GCloud Dot: probing, log scanning, and session-length learning."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
dirs.workspace = true

# Reading where the Windows installer put its files, which is how the updater
# knows this copy is one it may replace.
[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3"
